name: Build

on:
  pull_request:
    paths:
      - "FlowDown/**"
      - "Frameworks/**"
      - "FlowDownUnitTests/**"
      - "Resources/**"
      - "FlowDown.xcodeproj/**"
      - "FlowDown.xcworkspace/**"
      - ".github/workflows/ci.yml"
      - "ci_scripts/**"
      - "Makefile"
      - "Package.resolved"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-packages:
    name: Verify Package Pins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Required Pins
        run: python3 Resources/DevKit/scripts/required_package_pins.py check

  build:
    # A compile check: Debug, Apple Silicon only. Release archives for both
    # architectures are built by prebuild-macos-release.yml.
    name: Build (Mac Catalyst, arm64)
    runs-on: macos-26
    env:
      DERIVED_DATA: ${{ github.workspace }}/.ci/DerivedData
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Select Newest Xcode
        run: |
          chmod +x Resources/DevKit/scripts/select_newest_xcode.sh
          ./Resources/DevKit/scripts/select_newest_xcode.sh

      - name: Read Xcode Version
        id: xcode
        run: echo "version=$(xcodebuild -version | awk 'NR == 1 { print $2 }')" >> "$GITHUB_OUTPUT"

      - name: Restore SwiftPM Source Packages
        uses: actions/cache@v5
        with:
          path: .ci/DerivedData/SourcePackages
          key: flowdown-ci-${{ steps.xcode.outputs.version }}-swiftpm-${{ hashFiles('FlowDown.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'Frameworks/**/Package.resolved') }}
          restore-keys: |
            flowdown-ci-${{ steps.xcode.outputs.version }}-swiftpm-

      - name: Resolve Packages
        run: |
          set -o pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild \
            -workspace FlowDown.xcworkspace \
            -scheme FlowDown \
            -derivedDataPath "$DERIVED_DATA" \
            -resolvePackageDependencies \
            | xcbeautify --is-ci --disable-colored-output --disable-logging

      - name: Strip mlx-swift CUDA Plugin
        run: |
          chmod +x Resources/DevKit/scripts/strip_mlx_cuda_plugin.sh
          ./Resources/DevKit/scripts/strip_mlx_cuda_plugin.sh

      - name: Build
        run: |
          set -o pipefail
          mkdir -p BuildArtifacts
          xcodebuild \
            -workspace FlowDown.xcworkspace \
            -scheme FlowDown \
            -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath BuildArtifacts/build.xcresult \
            -skipMacroValidation \
            -skipPackagePluginValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build \
            | xcbeautify --is-ci --disable-colored-output --disable-logging

      - name: Upload Build Result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-xcresult
          path: BuildArtifacts/build.xcresult
          retention-days: 7
