name: Publish

# Fork-only release pipeline. Builds unsigned archives and publishes a
# GitHub Release so a maintainer can download and verify. This file is
# not intended for the upstream repository.

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 5.1.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    name: Build and publish
    runs-on: macos-26
    env:
      VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Newest Xcode
        run: |
          chmod +x Resources/DevKit/scripts/select_newest_xcode.sh
          ./Resources/DevKit/scripts/select_newest_xcode.sh

      - name: Install Metal Toolchain
        run: make install-metal-toolchain

      - name: Resolve Packages
        run: |
          set -o pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcodebuild \
            -workspace FlowDown.xcworkspace \
            -scheme FlowDown \
            -resolvePackageDependencies \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --is-ci --disable-colored-output --disable-logging

      - name: Strip mlx-swift CUDA Plugin
        run: |
          chmod +x Resources/DevKit/scripts/strip_mlx_cuda_plugin.sh
          ./Resources/DevKit/scripts/strip_mlx_cuda_plugin.sh

      - name: Archive iOS
        run: |
          set -o pipefail
          mkdir -p BuildArtifacts
          xcodebuild \
            -workspace FlowDown.xcworkspace \
            -scheme FlowDown \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            archive \
            -archivePath BuildArtifacts/ios.xcarchive \
            -resultBundlePath BuildArtifacts/ios.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --is-ci --disable-colored-output --disable-logging

      - name: Archive Mac Catalyst
        run: |
          set -o pipefail
          xcodebuild \
            -workspace FlowDown.xcworkspace \
            -scheme FlowDown \
            -configuration Release \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' \
            archive \
            -archivePath BuildArtifacts/macos.xcarchive \
            -resultBundlePath BuildArtifacts/macos.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            | xcbeautify --is-ci --disable-colored-output --disable-logging

      - name: Package artifacts
        run: |
          set -euo pipefail
          ditto -c -k --sequesterRsrc --keepParent \
            BuildArtifacts/ios.xcarchive \
            "BuildArtifacts/FlowDown-${VERSION}-ios.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            BuildArtifacts/macos.xcarchive \
            "BuildArtifacts/FlowDown-${VERSION}-macos.xcarchive.zip"

          APP_PATH=$(find BuildArtifacts/macos.xcarchive/Products -name "*.app" -maxdepth 4 | head -n 1)
          if [[ -n "${APP_PATH}" ]]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "${APP_PATH}" \
              "BuildArtifacts/FlowDown-${VERSION}-macos-unsigned.app.zip"
          fi

          {
            echo "Unsigned ${VERSION} build from ${GITHUB_SHA}."
            echo
            echo "The .app zip is unsigned. On macOS: unzip, then right-click the app and choose Open."
            echo "xcarchive zips are for Xcode Organizer / further signing."
          } > BuildArtifacts/notes.md

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlowDown-${{ env.VERSION }}-unsigned
          path: |
            BuildArtifacts/FlowDown-${{ env.VERSION }}-ios.xcarchive.zip
            BuildArtifacts/FlowDown-${{ env.VERSION }}-macos.xcarchive.zip
            BuildArtifacts/FlowDown-${{ env.VERSION }}-macos-unsigned.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists; deleting to replace"
            gh release delete "${VERSION}" --yes
          fi
          gh release create "${VERSION}" \
            --title "FlowDown ${VERSION}" \
            --notes-file BuildArtifacts/notes.md \
            BuildArtifacts/FlowDown-${VERSION}-ios.xcarchive.zip \
            BuildArtifacts/FlowDown-${VERSION}-macos.xcarchive.zip \
            BuildArtifacts/FlowDown-${VERSION}-macos-unsigned.app.zip
